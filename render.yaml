services:
  - type: web
    name: truthmap-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    disk:
      name: truthmap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/truthmap.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://truthmap-ai.vercel.app
      - key: SEARCH_PROVIDER
        value: none
